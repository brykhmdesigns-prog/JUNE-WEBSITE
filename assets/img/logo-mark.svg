    <!-- yarn strands -->
    <path d="M55 79c19 16 34 28 56 46" stroke-width="2.4" opacity=".5"/>
    <path d="M74 51c16 15 31 27 50 44" stroke-width="2.2" opacity=".38"/>
    <path d="M63 106c15 12 29 23 41 33" stroke-width="2.2" opacity=".38"/>
    <path d="M92 41c14 15 27 26 42 39" stroke-width="2" opacity=".3"/>
  </g>

  <!-- crochet hook -->
  <g stroke="url(#gold2)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <path d="M43 178 149 63" stroke="#fffaf6" stroke-width="13" opacity=".85"/>
    <path d="M43 178 149 63" stroke-width="7.5"/>
    <path d="M149 63c13-11 25-6 21 6-3 9-14 11-20 4" stroke-width="7.5"/>
  </g>
  <circle cx="43" cy="178" r="6.4" fill="url(#gold2)"/>
</svg>

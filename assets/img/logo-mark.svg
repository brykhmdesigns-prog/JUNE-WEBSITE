<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Disemba Crochet heart and hook mark">
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f9e9b4"/>
      <stop offset=".32" stop-color="#e2c463"/>
      <stop offset=".62" stop-color="#c39a2b"/>
      <stop offset=".84" stop-color="#a97f19"/>
      <stop offset="1" stop-color="#ecd691"/>
    </linearGradient>
    <linearGradient id="gold2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dfa0"/>
      <stop offset=".5" stop-color="#d0aa3d"/>
      <stop offset="1" stop-color="#b0881f"/>
    </linearGradient>
  </defs>

  <g fill="none" stroke="url(#gold)" stroke-linecap="round" stroke-linejoin="round">
    <!-- outer heart -->
    <path d="M100 173C100 173 18 118 18 62 18 33 41 12 65 12c16 0 29 9 35 21 6-12 19-21 35-21 24 0 47 21 47 50 0 56-82 111-82 111Z" stroke-width="6.5"/>
    <!-- inner woven heart -->
